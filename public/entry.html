<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>구매·지출 입력 - 주섬주섬 Finance</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주섬주섬 Finance">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<style>
  .wrap { max-width: 480px; margin: 24px auto; padding: 0 16px; }
  form.entry { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  /* 그리드 아이템은 기본 min-width:auto라 select 옵션 글자가 길면 그 칸이
     자기 몫(1fr)보다 넓어지려 해서 옆 칸과 크기가 안 맞거나 겹쳐 보이던
     원인 — min-width:0으로 1fr 몫만큼만 차지하게 강제 */
  form.entry > div { min-width: 0; }
  form.entry label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
  form.entry input, form.entry select {
    /* 16px 미만이면 iOS Safari가 포커스 시 화면을 자동 확대해버려서
       ("입력창 틀어짐"의 주 원인) 16px로 고정 */
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px;
    background: var(--card); color: var(--text); box-sizing: border-box;
  }
  form.entry .full { grid-column: 1 / -1; }
  button.primary {
    cursor: pointer; border: none; border-radius: 8px; padding: 12px 14px; font-size: 14px; font-weight: 700;
    background: var(--accent); color: white; width: 100%;
  }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 14px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: white;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; white-space: nowrap;
  }
</style>
</head>
<body>
<header class="top">
  <div class="title"><h1>📝 구매·지출 입력</h1></div>
  <div class="header-right">
    <a href="/" title="홈" style="font-size:20px;text-decoration:none;">🏠</a>
  </div>
</header>
<div class="wrap">
  <p class="note">로그인 없이 누구나 바로 입력할 수 있어요. 입력한 내용을 수정하거나 삭제해야 하면 관리자 페이지에서 해주세요.</p>
  <form class="entry" id="entryForm">
    <div class="full">
      <label>날짜</label>
      <input type="date" name="date" id="entryDate" required>
    </div>
    <div class="full">
      <label>어느 계좌에서 나갔나요 (밥값 등 카페 돈으로 결제했다면 카페 선택)</label>
      <select name="account">
        <option value="youth" selected>청년부</option>
        <option value="cafe">카페</option>
      </select>
    </div>
    <div class="full">
      <label>카테고리</label>
      <select name="category" id="entryCategory" required></select>
    </div>
    <div class="full">
      <label>내용</label>
      <input type="text" name="item" placeholder="예: 간식 구매" required>
    </div>
    <div>
      <label>거래처 (선택)</label>
      <input type="text" name="vendor" placeholder="예: OO마트">
    </div>
    <div>
      <label>금액 (RM)</label>
      <input type="number" name="amount" step="0.01" min="0.01" required>
    </div>
    <div class="full">
      <label>결제수단</label>
      <select name="payment" id="entryPayment" required></select>
    </div>
    <div class="full">
      <label>입력자</label>
      <input type="text" name="author" placeholder="이름" required>
    </div>
    <div class="full">
      <label>메모 (선택)</label>
      <input type="text" name="memo" placeholder="메모">
    </div>
    <div class="full">
      <label>영수증 사진 (선택)</label>
      <input type="file" name="receipt" accept="image/*">
    </div>
    <div class="full">
      <button class="primary" type="submit">저장</button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>
<script>
function todayLocalStr() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2200);
}

async function loadOptions() {
  const [catRes, payRes] = await Promise.all([
    fetch('/api/purchase-categories'),
    fetch('/api/payment-methods')
  ]);
  const cats = await catRes.json();
  const pays = await payRes.json();
  document.getElementById('entryCategory').innerHTML = cats.map((c) => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('entryPayment').innerHTML = pays.map((p) => `<option value="${p}">${p}</option>`).join('');
}

document.getElementById('entryDate').value = todayLocalStr();
loadOptions();

document.getElementById('entryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const res = await fetch('/api/entries/purchase', { method: 'POST', body: fd });
  if (res.ok) {
    toast('저장됐어요 ✓');
    const author = form.author.value;
    form.reset();
    document.getElementById('entryDate').value = todayLocalStr();
    form.author.value = author;
  } else {
    const data = await res.json().catch(() => ({}));
    toast('오류: ' + (data.error || '저장 실패'));
  }
});
</script>
</body>
</html>
