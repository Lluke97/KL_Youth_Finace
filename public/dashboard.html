<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>주섬주섬 Finance 대시보드</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주섬주섬 Finance">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="top">
  <div class="title">
    <h1>주섬주섬 Finance 대시보드</h1>
    <p>카페 수입/지출 + 회비 + 기타 내역을 한눈에</p>
  </div>
  <div class="header-right">
    <button id="themeBtn" title="테마 변경">🌓</button>
    <div class="nav-wrap">
      <button class="nav-btn" id="navBtn">☰</button>
      <div class="nav-menu" id="navMenu" hidden>
        <a href="/">🏠 홈</a>
        <a href="/dashboard.html" class="current">📊 대시보드</a>
        <a href="/entry.html">📝 구매·지출 입력</a>
        <a href="/income-entry.html">💰 입금 입력</a>
        <a href="/admin">🛠️ 관리자</a>
      </div>
    </div>
  </div>
</header>
<main>
  <div class="warn-banner" id="reviewBanner"></div>

  <div class="cat-toggle" id="accountToggle">
    <div class="chip selected" data-account="">전체</div>
    <div class="chip" data-account="youth">청년부</div>
    <div class="chip" data-account="cafe">카페</div>
  </div>

  <div class="balance-card">
    <div class="label" id="balanceLabel">현재 잔액 (장부 기준)</div>
    <div class="value" id="balanceValue">—</div>
  </div>

  <section class="block" id="settlementBlock" style="display:none;">
    <h2>실제 잔액 구성 (자동 계산)</h2>
    <div id="settlementNote" style="font-size:12px;color:var(--muted);margin-bottom:10px;"></div>
    <div class="cards" id="settlementCards"></div>
    <div id="settlementDiffNote" style="font-size:12px;margin-top:10px;"></div>
  </section>

  <div class="cards" id="sourceCards"></div>

  <section class="block">
    <h2>월별 수입/지출</h2>
    <div style="height:220px;"><canvas id="monthlyChart"></canvas></div>
  </section>

  <section class="block">
    <h2>카테고리별 보기</h2>
    <div class="cat-toggle" id="catToggle">
      <div class="chip selected" data-mode="expense">지출</div>
      <div class="chip" data-mode="income">수입</div>
    </div>
    <div class="cat-bars" id="catBars"></div>
  </section>

  <section class="block">
    <h2>구분별 요약 (카페운영 / 청년부 일반지출 / 확인필요)</h2>
    <table id="tagTable">
      <thead><tr><th>구분</th><th class="amount">수입</th><th class="amount">지출</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

</main>
<script>
document.getElementById('navBtn').addEventListener('click', function (e) {
  e.stopPropagation();
  document.getElementById('navMenu').hidden = !document.getElementById('navMenu').hidden;
});
document.addEventListener('click', function () {
  document.getElementById('navMenu').hidden = true;
});

const fmt = (n) => (n < 0 ? '-' : '') + 'RM' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const SOURCE_LABEL = { cafe: '카페', membership: '회비', manual: '수동입력', carryover: '이월금', transfer: '후원/이체', 'channel-transfer': '계좌 전환' };
const TAG_LABEL = { 'cafe-ops': '카페 운영', 'youth-general': '청년부 일반지출', 'needs-review': '⚠️ 분류 확인필요', untagged: '미분류' };

// Distinct, non-income/expense color palette — one hue per category so the
// breakdown stays readable even with many small categories mixed in.
const CAT_PALETTE = ['#6366f1', '#ec4899', '#14b8a6', '#f59e0b', '#8b5cf6', '#06b6d4', '#ef4444', '#84cc16', '#f472b6', '#0ea5e9', '#a855f7', '#22c55e'];
let catMode = 'expense';
let byCategoryCache = {};

function renderCategoryBars() {
  const el = document.getElementById('catBars');
  const entries = Object.entries(byCategoryCache)
    .map(([cat, v]) => [cat, v[catMode] || 0])
    .filter(([, amt]) => amt > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 12);
  if (!entries.length) { el.innerHTML = '<p style="font-size:12px;color:var(--muted);">표시할 내역이 없습니다.</p>'; return; }
  const max = Math.max(...entries.map(([, amt]) => amt));
  el.innerHTML = entries.map(([cat, amt], i) => {
    const color = CAT_PALETTE[i % CAT_PALETTE.length];
    const pct = Math.max(2, Math.round((amt / max) * 100));
    return `
      <div class="cat-row">
        <span class="cat-dot" style="background:${color}"></span>
        <span class="cat-name" title="${cat}">${cat}</span>
        <span class="cat-track"><span class="cat-fill" style="width:${pct}%;background:${color}"></span></span>
        <span class="cat-amount">${fmt(amt)}</span>
      </div>`;
  }).join('');
}

document.querySelectorAll('#catToggle .chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#catToggle .chip').forEach((c) => c.classList.remove('selected'));
    chip.classList.add('selected');
    catMode = chip.dataset.mode;
    renderCategoryBars();
  });
});

let currentAccount = ''; // '' = 전체, 'youth', 'cafe'
const ACCOUNT_LABEL = { '': '현재 잔액 (장부 기준)', youth: '청년부 잔액 (장부 기준)', cafe: '카페 잔액 (장부 기준)' };

document.querySelectorAll('#accountToggle .chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#accountToggle .chip').forEach((c) => c.classList.remove('selected'));
    chip.classList.add('selected');
    currentAccount = chip.dataset.account;
    document.getElementById('balanceLabel').textContent = ACCOUNT_LABEL[currentAccount];
    refreshAll();
  });
});

function withAccountQuery(url) {
  return currentAccount ? `${url}?account=${currentAccount}` : url;
}

async function loadSummary() {
  const res = await fetch(withAccountQuery('/api/summary'));
  const s = await res.json();

  document.getElementById('balanceValue').textContent = fmt(s.balance);
  lastBalance = s.balance;

  const cardsEl = document.getElementById('sourceCards');
  cardsEl.innerHTML = '';
  Object.entries(s.bySource).forEach(([src, v]) => {
    cardsEl.innerHTML += `
      <div class="card">
        <div class="label">${SOURCE_LABEL[src] || src}</div>
        <div class="value income">+${fmt(v.income)}</div>
        <div class="value expense">-${fmt(v.expense)}</div>
      </div>`;
  });

  const tagBody = document.querySelector('#tagTable tbody');
  tagBody.innerHTML = '';
  Object.entries(s.byTag).forEach(([tag, v]) => {
    tagBody.innerHTML += `<tr><td>${TAG_LABEL[tag] || tag}</td><td class="amount income">${fmt(v.income)}</td><td class="amount expense">${fmt(v.expense)}</td></tr>`;
  });

  byCategoryCache = s.byCategory || {};
  renderCategoryBars();

  const banner = document.getElementById('reviewBanner');
  if (s.needsReviewCount > 0) {
    banner.style.display = 'block';
    banner.textContent = `카페에서 가져온 지출 중 ${s.needsReviewCount}건이 "카페운영/청년부지출" 분류가 필요합니다. 관리자 페이지에서 확인해주세요.`;
  }

  lastMonthly = s.monthly.slice(-8);
  renderMonthlyChart(lastMonthly);
}

let monthlyChartInstance = null;
function renderMonthlyChart(monthly) {
  const style = getComputedStyle(document.documentElement);
  const incomeColor = style.getPropertyValue('--income').trim();
  const expenseColor = style.getPropertyValue('--expense').trim();
  const textColor = style.getPropertyValue('--muted').trim();
  const gridColor = style.getPropertyValue('--border').trim();

  const ctx = document.getElementById('monthlyChart').getContext('2d');
  if (monthlyChartInstance) monthlyChartInstance.destroy();
  monthlyChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: monthly.map((m) => m.month.slice(5) + '월'),
      datasets: [
        { label: '수입', data: monthly.map((m) => m.income), backgroundColor: incomeColor, borderRadius: 4 },
        { label: '지출', data: monthly.map((m) => m.expense), backgroundColor: expenseColor, borderRadius: 4 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, ticks: { color: textColor, callback: (v) => fmt(v) }, grid: { color: gridColor } },
        x: { ticks: { color: textColor }, grid: { display: false } }
      },
      plugins: {
        legend: { position: 'bottom', labels: { color: textColor, boxWidth: 12 } },
        tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${fmt(item.raw)}` } }
      }
    }
  });
}

// Theme toggle doesn't reload the page, so re-render with the new colors.
document.getElementById('themeBtn').addEventListener('click', () => {
  setTimeout(() => { if (lastMonthly) renderMonthlyChart(lastMonthly); }, 0);
});
let lastMonthly = null;

let lastBalance = 0;

async function loadSettlement() {
  const res = await fetch(withAccountQuery('/api/balance-breakdown'));
  const b = await res.json();
  const block = document.getElementById('settlementBlock');
  // '전체' 탭은 청년부/카페 두 계좌를 단순 합산한 것이라 기준일(baseline)이
  // 하나로 떨어지지 않는다 — 그래도 합계 카드는 그대로 보여주고, 안내문만
  // 계좌별 기준일을 따로 언급하도록 바꾼다.
  if (!b.baseline && !b.byAccount) { block.style.display = 'none'; return; }
  block.style.display = 'block';
  if (b.baseline) {
    document.getElementById('settlementNote').textContent =
      `${b.baseline.date} 실제 확인 기준으로 그 뒤 입력된 수입/지출을 현금·터치앤고·계좌별로 자동 반영한 값입니다.`;
  } else {
    const yDate = b.byAccount.youth.baseline ? b.byAccount.youth.baseline.date : '기록 없음';
    const cDate = b.byAccount.cafe.baseline ? b.byAccount.cafe.baseline.date : '기록 없음';
    document.getElementById('settlementNote').textContent =
      `청년부·카페 두 계좌를 각자 최근 확인 기준(청년부 ${yDate} / 카페 ${cDate})으로 자동 반영한 뒤 합친 값입니다.`;
  }

  const c = b.current;
  const cardsEl = document.getElementById('settlementCards');
  cardsEl.innerHTML = `
    <div class="card"><div class="label">💵 현금</div><div class="value">${fmt(c.cash)}</div></div>
    <div class="card"><div class="label">📱 터치앤고</div><div class="value">${fmt(c.tng)}</div></div>
    <div class="card"><div class="label">🏦 계좌/카드</div><div class="value">${fmt(c.bank)}</div></div>
    <div class="card"><div class="label">합계</div><div class="value">${fmt(c.total)}</div></div>`;

  const diffNote = document.getElementById('settlementDiffNote');
  if (b.unattributedCount > 0) {
    diffNote.textContent = `⚠ 결제/수령 방법이 입력 안 된 내역 ${b.unattributedCount}건(${fmt(Math.abs(b.unattributedAmount))})은 이 계산에서 빠져 있어요.`;
    diffNote.style.color = 'var(--expense)';
  } else {
    diffNote.textContent = '✓ 최근 확인 이후 입력된 내역이 모두 반영되어 있습니다.';
    diffNote.style.color = 'var(--income)';
  }
}

function refreshAll() {
  loadSummary().then(loadSettlement);
}
refreshAll();

// Admin entries are made on a different page (often a different tab/device),
// so re-pull the numbers whenever this tab becomes active again instead of
// showing whatever was on screen when it was last loaded.
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll(); });
window.addEventListener('focus', refreshAll);
</script>
</body>
</html>
